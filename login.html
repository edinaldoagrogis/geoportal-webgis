<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoPortal – Login</title>
  <link rel="stylesheet" href="login.css" />
  <link rel="manifest" href="manifest.json" />
  <script defer src="login.js"></script>
</head>
<body>
  <div class="login-card">
    <h1>GeoPortal</h1>
    <input id="user" type="text" placeholder="Usuário" autocomplete="username" />
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password" />
    <button id="loginBtn">Entrar</button>
    <p class="link" id="changeLink">Alterar senha</p>
  </div>
</body>
</html>
